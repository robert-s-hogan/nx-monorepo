<script>
/* Exercise demo engine: a 3D stick figure posed per exercise, drawn from two camera angles at real tempo */
(function(){
const D2R=Math.PI/180;
const V=(x,y,z)=>({x:x,y:y,z:z||0});
const add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z), sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z), mul=(a,s)=>V(a.x*s,a.y*s,a.z*s);
const dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z, len=a=>Math.sqrt(dot(a,a)), norm=a=>{const l=len(a)||1;return mul(a,1/l);};
const lerp=(a,b,t)=>a+(b-a)*t, lerpV=(a,b,t)=>V(lerp(a.x,b.x,t),lerp(a.y,b.y,t),lerp(a.z,b.z,t));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function tl(t,k){for(let i=0;i<k.length-1;i++){if(t<=k[i+1][0]){const span=(k[i+1][0]-k[i][0])||1;const u=(t-k[i][0])/span;const e=(1-Math.cos(Math.PI*u))/2;return lerp(k[i][1],k[i+1][1],e);}}return k[k.length-1][1];}
const S={thigh:.45,shin:.43,upper:.30,fore:.28,torso:.50,neck:.09,head:.11,shW:.19,hipW:.10,foot:.19};

function ik(A,T,a,b,pole){
  const d=sub(T,A);const dist=clamp(len(d),Math.abs(a-b)+1e-3,a+b-1e-4);const u=norm(d);
  const ca=clamp((a*a+dist*dist-b*b)/(2*a*dist),-1,1);const sa=Math.sqrt(1-ca*ca);
  let p=sub(pole,mul(u,dot(pole,u)));if(len(p)<1e-6)p=V(0,1,0);p=norm(p);
  return [add(A,add(mul(u,a*ca),mul(p,a*sa))),add(A,mul(u,dist))];
}

function build(p){
  const pel=p.pelvis;let up,chest;
  if(p.chest){chest=p.chest;up=norm(sub(chest,pel));}
  else{const t=(p.tor||0)*D2R;up=V(Math.sin(t),Math.cos(t),0);chest=add(pel,mul(up,S.torso));}
  const hd=p.headDir?norm(p.headDir):up;
  const neck=add(chest,mul(hd,S.neck)), head=add(neck,mul(hd,S.head));
  const sh={L:add(chest,V(0,0,-S.shW)),R:add(chest,V(0,0,S.shW))}, hp={L:add(pel,V(0,0,-S.hipW)),R:add(pel,V(0,0,S.hipW))};
  const segs=[{a:chest,b:neck,w:.8}], hands={};
  ["L","R"].forEach(s=>{
    const lg=p.legs[s];let knee,ankle;
    if(lg.knee){knee=lg.knee;ankle=lg.ankle;}else{const r=ik(hp[s],lg.ankle,S.thigh,S.shin,lg.pole||V(1,0,0));knee=r[0];ankle=r[1];}
    const toe=lg.toe||add(ankle,V(S.foot,-.05,0)), heel=lg.heel||add(ankle,V(-.04,-.05,0));
    segs.push({a:hp[s],b:knee,side:s},{a:knee,b:ankle,side:s},{a:heel,b:toe,side:s,w:.7},{a:ankle,b:heel,side:s,w:.7});
    const ar=p.arms[s];let el,hand;
    if(ar.elbow){el=ar.elbow;hand=ar.hand;}else{const r=ik(sh[s],ar.hand,S.upper,S.fore,ar.pole||V(-1,0,0));el=r[0];hand=r[1];}
    segs.push({a:sh[s],b:el,side:s},{a:el,b:hand,side:s});
    hands[s]=hand;
  });
  return {segs:segs,torso:[hp.L,hp.R,sh.R,sh.L],head:head,hands:hands,hipL:hp.L,hipR:hp.R};
}

const FLOOR={t:"quad",floor:true,pts:[V(-1.4,0,-.7),V(1.4,0,-.7),V(1.4,0,.7),V(-1.4,0,.7)]};
const box=(min,max)=>({t:"box",min:min,max:max});
const quad=pts=>({t:"quad",pts:pts});
const line=(a,b)=>({t:"line",a:a,b:b});

const wallQ=x=>quad([V(x,0,-.45),V(x,0,.45),V(x,1.75,.45),V(x,1.75,-.45)]);
// g = side being stretched (-1 left, +1 right)
function quadPose(t,g){
  const br=.01*Math.sin(2*Math.PI*t), S=g<0?"L":"R", O=g<0?"R":"L", hip=V(0,.93+br,g*.1);
  const knee=add(hip,V(-.02,-.45,0)), ankle=add(knee,V(-.15,.40,0)), legs={}, arms={};
  legs[S]={knee:knee,ankle:ankle,toe:add(ankle,V(-.04,.17,0)),heel:add(ankle,V(.04,-.03,0))};
  legs[O]={ankle:V(0,.07,-g*.12),pole:V(1,0,0)};
  arms[S]={hand:add(ankle,V(0,.03,g*.04)),pole:V(0,-1,g*.5)};
  arms[O]={hand:V(.42,1.25,-g*.25),pole:V(0,-1,-g*.3)};
  return {pose:{pelvis:V(0,.93+br,0),tor:0,legs:legs,arms:arms},props:[FLOOR,wallQ(.5)],items:[]};
}
function hamPose(t,g){
  const S=g<0?"L":"R", O=g<0?"R":"L", pel=V(-.12,.84,0), tor=50+3*Math.sin(2*Math.PI*t), legs={};
  legs[S]={ankle:V(.34,.08,g*.12),pole:V(0,1,0),toe:V(.42,.2,g*.12),heel:V(.32,.03,g*.12)};

const VIEWS={side:{yaw:.14,pitch:.08,label:"Side"},front:{yaw:1.05,pitch:.32,label:"Front ¾"}};
function proj(p,v){const cy=Math.cos(v.yaw),sy=Math.sin(v.yaw),cp=Math.cos(v.pitch),sp=Math.sin(v.pitch);
  const X=p.x*cy-p.z*sy, d=p.x*sy+p.z*cy;return {X:X,Y:p.y*cp-d*sp,D:d*cp+p.y*sp};}
function viewDir(v){return V(Math.sin(v.yaw)*Math.cos(v.pitch),Math.sin(v.pitch),Math.cos(v.yaw)*Math.cos(v.pitch));}

function frame(ex,t){
  const r=EXD[ex].f(t), fig=build(r.pose), items=[];
  r.items.forEach(it=>{
    const h=it.mid?mul(add(fig.hands.L,fig.hands.R),.5):fig.hands[it.hand];
    if(it.t==="kb") items.push({t:"kb",h:h,c:add(h,V(0,-.15,0))});
    else items.push({t:"db",h:h,a:sub(h,mul(it.axis,.12)),b:add(h,mul(it.axis,.12))});
  });
  return {fig:fig,props:r.props,items:items};
}
function boxFaces(b){const a=b.min,c=b.max;const P=(x,y,z)=>V(x?c.x:a.x,y?c.y:a.y,z?c.z:a.z);
  return [{n:V(0,1,0),pts:[P(0,1,0),P(1,1,0),P(1,1,1),P(0,1,1)],top:true},{n:V(0,-1,0),pts:[P(0,0,0),P(1,0,0),P(1,0,1),P(0,0,1)]},
    {n:V(1,0,0),pts:[P(1,0,0),P(1,1,0),P(1,1,1),P(1,0,1)]},{n:V(-1,0,0),pts:[P(0,0,0),P(0,1,0),P(0,1,1),P(0,0,1)]},
    {n:V(0,0,1),pts:[P(0,0,1),P(1,0,1),P(1,1,1),P(0,1,1)]},{n:V(0,0,-1),pts:[P(0,0,0),P(1,0,0),P(1,1,0),P(0,1,0)]}];}

const bcache={};
function bounds(ex,vk){
  const key=ex+"|"+vk;if(bcache[key])return bcache[key];
  const v=VIEWS[vk];let b={x0:1e9,x1:-1e9,y0:1e9,y1:-1e9};
  const inc=(p,r)=>{const q=proj(p,v);r=r||0;b.x0=Math.min(b.x0,q.X-r);b.x1=Math.max(b.x1,q.X+r);b.y0=Math.min(b.y0,q.Y-r);b.y1=Math.max(b.y1,q.Y+r);};
  for(let i=0;i<24;i++){const f=frame(ex,i/24);
    f.fig.segs.forEach(s=>{inc(s.a,.05);inc(s.b,.05);});inc(f.fig.head,S.head+.02);
    f.items.forEach(it=>{if(it.t==="kb")inc(it.c,.12);else{inc(it.a,.07);inc(it.b,.07);}});
    f.props.forEach(p=>{if(p.floor)return;if(p.t==="box")boxFaces(p).forEach(fc=>fc.pts.forEach(q=>inc(q)));else if(p.t==="quad")p.pts.forEach(q=>inc(q));else{inc(p.a);inc(p.b);}});}
  inc(V(0,0,0));
  return bcache[key]=b;
}

function readCols(){const cs=getComputedStyle(document.documentElement);const g=n=>cs.getPropertyValue(n).trim();
  return {ink:g("--ink"),far:g("--muted"),prop:g("--line"),edge:g("--muted"),kit:g("--brass"),bg:g("--bg")};}

function draw(cv,ex,t,col){
  const vk=cv.dataset.view, v=VIEWS[vk];
  const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;
  const dpr=Math.min(3,window.devicePixelRatio||1);
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
  const ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  const b=bounds(ex,vk), padX=10, padT=24, padB=8;
  const sc=Math.min((w-2*padX)/(b.x1-b.x0),(h-padT-padB)/(b.y1-b.y0));
  const ox=padX+((w-2*padX)-(b.x1-b.x0)*sc)/2-b.x0*sc;
  const oy=padT+((h-padT-padB)+(b.y1-b.y0)*sc)/2+b.y0*sc;
  const P=p=>{const q=proj(p,v);return [ox+q.X*sc,oy-q.Y*sc,q.D];};
  const f=frame(ex,t), vd=viewDir(v);
  ctx.lineCap="round";ctx.lineJoin="round";
  const poly=(pts,fill,stroke,alpha)=>{ctx.beginPath();pts.forEach((p,i)=>{const q=P(p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);});ctx.closePath();
    ctx.globalAlpha=alpha;ctx.fillStyle=fill;ctx.fill();ctx.globalAlpha=1;if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.globalAlpha=.55;ctx.stroke();ctx.globalAlpha=1;}};
  // props behind the figure
  const props=[];
  f.props.forEach(p=>{
    if(p.t==="box")boxFaces(p).forEach(fc=>{if(dot(fc.n,vd)>0.01)props.push({pts:fc.pts,a:fc.top?.95:.6,d:fc.pts.reduce((s,q)=>s+P(q)[2],0)/4});});
    else if(p.t==="quad")props.push({pts:p.pts,a:p.floor?.45:.7,d:p.floor?-99:p.pts.reduce((s,q)=>s+P(q)[2],0)/4,floor:p.floor});
    else props.push({line:p,d:(P(p.a)[2]+P(p.b)[2])/2});
  });
  props.sort((a,c)=>a.d-c.d).forEach(p=>{
    if(p.line){const a=P(p.line.a),c=P(p.line.b);ctx.strokeStyle=col.edge;ctx.lineWidth=Math.max(2,.03*sc);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);ctx.stroke();}
    else poly(p.pts,col.prop,p.floor?null:col.edge,p.a);
  });

  const fig=f.fig, dL=P(fig.hipL)[2], dR=P(fig.hipR)[2], farSide=dL<dR?"L":"R";
  const parts=[];
  fig.segs.forEach(s=>{const a=P(s.a),c=P(s.b);parts.push({d:(a[2]+c[2])/2,draw(){ctx.strokeStyle=s.side===farSide?col.far:col.ink;ctx.lineWidth=(s.w||1)*.075*sc;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);ctx.stroke();}});});
  const tp=fig.torso.map(P);
  parts.push({d:tp.reduce((s,q)=>s+q[2],0)/4,draw(){ctx.beginPath();tp.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fillStyle=col.ink;ctx.strokeStyle=col.ink;ctx.lineWidth=.08*sc;ctx.fill();ctx.stroke();}});
  const hq=P(fig.head);
  parts.push({d:hq[2],draw(){ctx.beginPath();ctx.arc(hq[0],hq[1],S.head*sc,0,Math.PI*2);ctx.fillStyle=col.ink;ctx.fill();}});
  f.items.forEach(it=>{
    if(it.t==="kb"){const c=P(it.c),hh=P(add(it.h,V(0,-.035,0)));parts.push({d:c[2]+.001,draw(){
      ctx.strokeStyle=col.kit;ctx.lineWidth=.028*sc;ctx.beginPath();ctx.arc(hh[0],hh[1],.05*sc,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.arc(c[0],c[1],.1*sc,0,Math.PI*2);ctx.fillStyle=col.kit;ctx.fill();}});}
    else{const a=P(it.a),c=P(it.b);parts.push({d:(a[2]+c[2])/2+.001,draw(){
      ctx.strokeStyle=col.kit;ctx.lineWidth=.035*sc;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);ctx.stroke();
      ctx.fillStyle=col.kit;[a,c].forEach(q=>{ctx.beginPath();ctx.arc(q[0],q[1],.055*sc,0,Math.PI*2);ctx.fill();});}});}
  });
  parts.sort((a,c)=>a.d-c.d).forEach(p=>p.draw());
}

let playing=true;
try{ if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) playing=false; }catch(e){}
let clock=0,last=performance.now(),col=null,colAt=0;
function loop(now){
  requestAnimationFrame(loop);
  if(playing) clock+=Math.max(0,Math.min(.1,(now-last)/1000)); last=now; // the first frame time can be before `last`
  document.querySelectorAll(".coach").forEach(updateCoach);
  const cvs=document.querySelectorAll("canvas.demo-c");if(!cvs.length)return;
  if(!col||now-colAt>1000){col=readCols();colAt=now;}
  cvs.forEach(cv=>{let ex=cv.dataset.ex;
    const d=cv.closest(".demo");
    if(d&&d.dataset.list){ if(!d._list){ try{ d._list=JSON.parse(decodeURIComponent(d.dataset.list)); }catch(e){ d._list=[]; } }
      if(d._list.length){ const i=Math.floor(clock/6)%d._list.length, it=d._list[i]; ex=it.k;
        const lab=d.querySelector(".demo-now"); if(lab&&lab._i!==i){ lab._i=i; lab.textContent=(i+1)+" of "+d._list.length+" · "+it.name; } } }
    const def=EXD[ex];if(!def)return;const t=((clock/def.dur)%1+1)%1;try{draw(cv,ex,t,col);}catch(e){}});
}
/* Coaching strip: cycles steps, cues and mistakes; each line stays up long enough to read (or to hear) */
const canSpeak=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
// Phones only let a page talk after a tap, so voice starts off on every visit and is turned on by a tap
let voiceOn=false, voiceOk=false;
const tipDur=l=>voiceOn?Math.min(8,1.6+l.text.length*.075):Math.min(6,2.2+l.text.length*.05);
let voice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/natural|enhanced|premium|samantha|google/i.test(v.name))||vs.find(v=>/^en/i.test(v.lang))||null; }catch(e){} }
if(canSpeak){ pickVoice(); try{ speechSynthesis.onvoiceschanged=pickVoice; }catch(e){} }
function say(l){ if(!canSpeak) return; try{ speechSynthesis.cancel();
  const pre="";
  const u=new SpeechSynthesisUtterance(pre+l.text); u.rate=.95; u.lang="en-US"; if(voice) u.voice=voice; u.onstart=()=>{ voiceOk=true; document.querySelectorAll(".vnote").forEach(n=>n.hidden=true); };
  try{ speechSynthesis.resume(); }catch(e){} speechSynthesis.speak(u); }catch(e){} }
function hush(){ if(canSpeak) try{ speechSynthesis.cancel(); }catch(e){} }
let muteUntil=0, quietMode=false; // quiet while tempo beeps run
const firstCoach=()=>Array.from(document.querySelectorAll(".coach")).find(c=>c.offsetParent!==null);
function coachSched(el){
  if(el._lines) return;
  try{ el._lines=JSON.parse(decodeURIComponent(el.dataset.lines)); }catch(e){ el._lines=[]; }
  const slow=el.dataset.slow==="1";
  let acc=0; el._starts=el._lines.map(l=>{ const st=acc; acc+=(slow&&voiceOn)?120:tipDur(l); return st; });
  el._total=acc; el._off=el._off||0; el._idx=-1;
}
function coachPos(el){ const n=el._lines.length; if(!n) return null;
  const t=((clock+el._off)%el._total+el._total)%el._total;
  let i=n-1; for(let j=0;j<n;j++){ if(t<el._starts[j+1]||j===n-1){ i=j; break; } }
  const end=i<n-1?el._starts[i+1]:el._total; return {i:i,t:t,end:end}; }
function updateCoach(el){
  coachSched(el); const p=coachPos(el); if(!p) return; const l=el._lines[p.i];
  if(p.i!==el._idx){ el._idx=p.i; el.dataset.k=l.k;
    if(voiceOn&&playing) el._say=true; // spoken below, once any announcement has finished
    el.querySelector(".coach-tag").textContent=l.tag; el.querySelector(".coach-text").textContent=l.text;
    el.querySelector(".coach-n").textContent=(p.i+1)+" / "+el._lines.length+" · tap for next";
    const tx=el.querySelector(".coach-text"); tx.classList.remove("in"); void tx.offsetWidth; tx.classList.add("in"); }
  if(el._say&&voiceOn&&playing&&!quietMode&&performance.now()>muteUntil&&el===firstCoach()){ el._say=false; say(el._lines[el._idx]); }
  const st=el._starts[p.i]; el.querySelector(".coach-bar i").style.width=((p.t-st)/(p.end-st)*100)+"%";
}
document.addEventListener("click",ev=>{const c=ev.target.closest(".coach");if(!c)return;coachSched(c);const p=coachPos(c);if(p)c._off+=(p.end-p.t)+.01;updateCoach(c);if(voiceOn&&!playing&&c._lines[c._idx])say(c._lines[c._idx]);});
document.addEventListener("keydown",ev=>{const c=ev.target.closest&&ev.target.closest(".coach");if(!c||(ev.key!=="Enter"&&ev.key!==" "))return;ev.preventDefault();c.click();});
requestAnimationFrame(loop);
function setVoice(on){
  voiceOn=on;
  document.querySelectorAll(".demo-voice").forEach(x=>{x.setAttribute("aria-pressed",String(on));x.textContent=on?"Voice on":"Voice off";});
  document.querySelectorAll(".vgate").forEach(x=>x.hidden=on);
  if(!on){ hush(); document.querySelectorAll(".vnote").forEach(n=>n.hidden=true); }
  document.querySelectorAll(".coach").forEach(el=>{ const idx=Math.max(0,el._idx||0); el._lines=null; coachSched(el); el._off=el._starts[idx]-clock+.01; el._idx=-1; });
  if(on){ // speaking inside the tap is what unlocks the phone's voice
    voiceOk=false; say({k:"x",text:"Voice on."}); muteUntil=performance.now()+1500;
    setTimeout(()=>{ if(voiceOn&&!voiceOk) document.querySelectorAll(".vnote").forEach(n=>n.hidden=false); },2500); }
}
document.addEventListener("click",ev=>{const b=ev.target.closest(".demo-voice,.voice-gate");if(!b)return;
  setVoice(b.classList.contains("voice-gate")?true:!voiceOn);
});
document.addEventListener("click",ev=>{const b=ev.target.closest(".demo-toggle");if(!b)return;playing=!playing;if(!playing)hush();
  document.querySelectorAll(".demo-toggle").forEach(x=>x.textContent=playing?"Pause":"Play");});

window.DEMO={
  has:ex=>!!EXD[ex],
  gate(){
    if(!canSpeak) return `<div class="hint">Voice tips aren't available in this browser. Open this page in Safari to hear them.</div>`;
    return `${voiceOn?"":`<button class="voice-gate vgate" type="button"><b>Tap to turn on voice coaching</b><span>Your phone needs one tap each visit before it can talk.</span></button>`}
      <div class="vnote hint" hidden>No sound came through. Check that your phone isn't on silent and the volume is up. If it's still quiet, open this page in Safari.</div>`;
  },
  quiet(v){ quietMode=!!v; if(v) hush(); },
  play(){ playing=true; document.querySelectorAll(".demo-toggle").forEach(x=>x.textContent="Pause"); },
  announce(text){ if(!voiceOn||!canSpeak) return; say({k:"x",text:text}); muteUntil=performance.now()+(1.2+text.length*.075)*1000; },
  html(ex,lines,video,extra,opts){if(!EXD[ex])return "";
    const esc=x=>String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const first=lines&&lines[0];
    const coach=first?`<div class="coach" data-k="${first.k}"${opts&&opts.slow?' data-slow="1"':""} data-lines="${encodeURIComponent(JSON.stringify(lines))}" role="button" tabindex="0" aria-label="Form tips. Tap for the next tip.">
        <div class="coach-head"><span class="coach-tag">${esc(first.tag)}</span><span class="coach-n">1 / ${lines.length}</span></div>
        <div class="coach-text">${esc(first.text)}</div><i class="coach-bar"><i></i></i></div>`:"";
    const list=opts&&opts.list;
    return `<div class="demo"${list?` data-list="${encodeURIComponent(JSON.stringify(list))}"`:""}>${list?`<div class="demo-now">1 of ${list.length} · ${esc(list[0].name)}</div>`:""}<div class="demo-views">${["side","front"].map(vk=>`<figure><canvas class="demo-c" data-ex="${ex}" data-view="${vk}" role="img" aria-label="${VIEWS[vk].label} view of the movement"></canvas><figcaption>${VIEWS[vk].label}</figcaption></figure>`).join("")}${coach}</div>${extra||""}
      <div class="demo-bar">${video?`<a class="btn" href="${video}" target="_blank" rel="noopener">YouTube ↗</a>`:""}<span class="sp"></span>${canSpeak?`<button class="demo-voice" type="button" aria-pressed="${voiceOn}">${voiceOn?"Voice on":"Voice off"}</button>`:""}<button class="demo-toggle" type="button">${playing?"Pause":"Play"}</button></div></div>`;},
  _frame:frame,_bounds:bounds
};
})();

    t += tog ? it.sets*work*2 + 20 : it.sets*work + (it.sets-1)*it.rest + it.rest;

/* ---------- audio / wake lock ---------- */
let actx=null, lock=null;
function unlockAudio(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){} }
function beep(){
  try{ if(!actx) return; [0,.25].forEach(off=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; const t=actx.currentTime+off;
    g.gain.setValueAtTime(.25,t); g.gain.exponentialRampToValueAtTime(.001,t+.2); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+.2); }); }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([150,80,150]); }catch(e){}
}
async function keepAwake(){ try{ if(navigator.wakeLock && !lock){ lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release",()=>{lock=null;}); } }catch(e){} }
const announce = t => { try{ DEMO.announce(t); }catch(e){} };

  if(!P || P.phase!=="work") return; const e=EX[curKey()];
  if(e.type==="flow") return;
  if(P.together && !SESS[P.sid].solo) announce((isKidTurn()? partner()+"'s turn. " : "Your turn. ")+e.name+".");
  else if(P.s===0) announce(e.name+".");
}

/* ---------- tempo beeps: a high beep starts each rep, low ticks count the seconds ---------- */
const TEMPO={pushup:[["Down",3],["Up",1]],pushupk:[["Down",3],["Up",1]],dbrow:[["Pull",1],["Hold",1],["Lower",2]],
  calfraise:[["Up",1],["Hold",1],["Down",3]],bridge:[["Up",1],["Hold",2],["Down",2]],kbdeadlift:[["Down",2],["Up",1],["Squeeze",1]]};
let T=null, tTimer=null;
function tone(f,d,v){ try{ if(!actx) return; const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
  o.frequency.value=f; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); }catch(e){} }
function startTempo(){ unlockAudio(); const seq=TEMPO[curKey()]; if(!seq) return; stopTempo();
  T={seq:seq, t0:Date.now()+2000, last:""}; try{ DEMO.quiet(true); }catch(e){} tTimer=setInterval(tickTempo,40); }
function stopTempo(){ if(tTimer) clearInterval(tTimer); tTimer=null; T=null; try{ DEMO.quiet(false); }catch(e){} }
function tickTempo(){
  if(!T) return; const now=Date.now(), el=document.getElementById("tempo");
  if(now<T.t0){ const id="lead"+Math.ceil((T.t0-now)/1000); if(T.last!==id){ T.last=id; tone(660,.08,.2); }
    if(el){ el.querySelector(".tp-ph").textContent="Get set"; el.querySelector(".tp-rep").textContent=""; } return; }
  const L=T.seq.reduce((a,q)=>a+q[1],0), t=(now-T.t0)/1000, rep=Math.floor(t/L)+1; let x=t%L, pi=0;
  while(pi<T.seq.length-1 && x>=T.seq[pi][1]){ x-=T.seq[pi][1]; pi++; }
  const sec=Math.floor(x), id=rep+"-"+pi+"-"+sec;
  if(T.last!==id){ T.last=id; if(sec===0) tone(pi===0?988:740,.14,.3); else tone(520,.06,.15); }
  if(el){ el.querySelector(".tp-ph").textContent=T.seq[pi][0]; el.querySelector(".tp-rep").textContent="Rep "+rep;
    el.querySelector(".tp-bar i").style.width=Math.min(100,(x/T.seq[pi][1])*100)+"%"; }
}
const tempoPanel = () => `<div class="tempo" id="tempo" aria-live="off"><div class="tp-row"><span class="tp-ph">Get set</span><span class="tp-rep"></span></div><i class="tp-bar"><i></i></i></div>`;

/* ---------- workout flow ---------- */
function start(sid){
  unlockAudio(); keepAwake(); try{ DEMO.play(); }catch(e){}
  P = {v:2, sid, i:0, s:0, turn:0, together: !!store.together && !SESS[sid].solo, phase:"work", setsDone:0, startedAt:Date.now()};
  if(SESS[sid].knee) P.phase="check";
  persist(); view="workout"; endArm=false; render(); announceTurn();
}
function persist(){ store.active = P; save(); }
function setDone(){
  stopTempo();
  const it=item();
  if(!isKidTurn()) P.setsDone++;
  if(P.together && !isFlow(it.ex)){
    if(P.turn===0){ P.turn=1; P.phase="work"; persist(); render(); announceTurn(); return; }
    P.turn=0;
  }
  advance(it.rest);
}
function advance(rest){
  const items=SESS[P.sid].items, it=items[P.i];
  if(P.s+1 < setsOf(it)){
    P.s++;
    if(P.together){ P.phase="work"; persist(); render(); announceTurn(); return; } // the other person's set was the rest
  } else if(P.i+1 < items.length){
    P.i++; P.s=0; if(P.together) rest=20;
  } else { finish(); return; }
  if(rest>0){ P.phase="rest"; P.restEnd=Date.now()+rest*1000; P.restLen=rest; } else { P.phase="work"; }
  persist(); render(); announceTurn();
}
function finish(){
  if(!isDone(todayKey(),P.sid)) store.done.push({d:todayKey(), sid:P.sid});
  P.phase="done"; P.endedAt=Date.now(); persist(); render();
  announce(P.together? "Nice work, you two." : "Nice work.");
}
function closeWorkout(){ stopTempo(); store.active=null; P=null; save(); view="week"; render(); }
const SWITCH_SEC = 5;
function partCoach(part){
  const out=[]; let d=0,n=0;
  while(d<part.do.length||n<part.dont.length){
    for(let j=0;j<2&&d<part.do.length;j++) out.push({tag:"Do",text:part.do[d++],k:"cue"});
    if(n<part.dont.length) out.push({tag:"Don't",text:part.dont[n++],k:"avoid"}); }
  return out;
}
function startFlow(){ keepAwake(); const F=parts(); P.phase="flow"; P.fi=0; P.sw=true; P.flowLen=3; P.flowEnd=Date.now()+3000;
  persist(); render(); announce("Get ready. "+F[0].name+"."); }
function startPart(){ const F=parts(); P.sw=false; P.flowLen=F[P.fi].sec; P.flowEnd=Date.now()+P.flowLen*1000; beep(); persist(); render(); announce(F[P.fi].say); }
function endPart(){
  const F=parts(); beep();
  if(P.fi+1>=F.length){ P.sw=false; P.phase="work"; advance(0); return; }
  P.fi++; P.sw=true; P.flowLen=SWITCH_SEC; P.flowEnd=Date.now()+SWITCH_SEC*1000; persist(); render(); announce("Next up: "+F[P.fi].name+".");
}
function nextFlow(){ if(P.sw) startPart(); else endPart(); }

/* ---------- timer loop ---------- */
setInterval(()=>{
  if(!P) return;
  const now = Date.now();
  if(P.phase==="rest"){
    const left=(P.restEnd-now)/1000;
    if(left<=0){ beep(); P.phase="work"; persist(); render(); announceTurn(); return; }
    setClock(left, 1-left/P.restLen);
  } else if(P.phase==="hold"){
    const el=(now-P.holdStart)/1000, left=P.holdLen-el;
    if(left<=0){ beep(); setDone(); return; }
    setClock(left, el/P.holdLen);
  } else if(P.phase==="flow"){
    const sec=P.flowLen||parts()[P.fi].sec, left=(P.flowEnd-now)/1000;
    if(left<=0){ if(P.sw) startPart(); else endPart(); return; }
    setClock(left, 1-left/sec);
  }
},250);
function setClock(sec, frac){
  const c=document.getElementById("clock"); if(c) c.textContent=fmt(sec);
  const b=document.getElementById("fill"); if(b) b.style.width=Math.min(100,Math.max(0,frac*100))+"%";
}

/* ---------- coaching lines + videos ---------- */
function coach(key, during){
  const e=EX[key], sy=SAY[key];
  if(!sy){ return [...e.cues.map(x=>({tag:"Do",text:x,k:"cue"})), ...e.mistakes.map(x=>({tag:"Don't",text:x,k:"avoid"}))]; }
  const out=during?[]:sy.setup.map(x=>({tag:"",text:x,k:"step"}));
  // two dos, then a don't, repeating, so the don'ts keep coming back around
  let d=0,n=0; while(d<sy.do.length||n<sy.dont.length){
    for(let j=0;j<2&&d<sy.do.length;j++) out.push({tag:"Do",text:sy.do[d++],k:"cue"});
    if(n<sy.dont.length) out.push({tag:"Don't",text:sy.dont[n++],k:"avoid"}); }
  // the basics come at the end of each round of tips
  const kid = typeof P!=="undefined" && P && P.phase!=="done" && isKidTurn();
  const why = kid ? BASICS.kid : key==="treadmill" ? BASICS.walk : key==="warmup" ? BASICS.warmup : key==="cooldown" ? ["Gentle stretching keeps your hips and knees moving freely.","Slow breaths help you relax into it."] : [...(BASICS[key]||[]), ...BASICS.strength];
  why.forEach(x=>out.push({tag:"Why it works",text:x,k:"why"}));
  return out;
}
const BASICS={
  walk:["Talking pace. That's your fat-burning zone.","Zone 2 means you can talk, but not sing.","Total calories matter more than the zone.","Fat loss is mostly the kitchen. You can't out-walk a donut.","Want faster results? Walk past the snack drawer.","Thirty minutes a day covers most of your weekly target."],
  strength:["The last few good reps build the muscle.","Stop with one to three good reps left.","Form breaks, set's over.","Slow on the way down. That's where the work is.","Easy reps are the warm-up. The hard ones count.","Keeping muscle means more of what you lose is fat."],
  warmup:["Two easy minutes now. Happier knees later."],
  kid:["Good form beats more reps.","Stop while it still looks good.","Strong and having fun. That's the goal."],
  pushup:["Push-ups build muscle like the bench press when you scale them right."],
  pushupk:["Knee push-ups build the same muscles. Move to full ones when twenty gets easy."],
  dbrow:["Pulling balances out all that pushing."],
  kbhold:["Grip strength tracks your overall strength. Squeeze like you mean it."],
  wallsit:["Strong quads take load off your knees."],
  calfraise:["Strong calves help soak up impact when you walk."],
  bridge:["Strong glutes help keep your knees lined up."],
  kbdeadlift:["Your hips do the lifting. Your back just stays flat."]
};
const DEFAULT_VIDEOS={
  pushup:[{id:"4Bc1tPaYkOo",short:true,title:"FIX THESE Pushup Mistakes!",by:"Andrew Kwong (DeltaBolic)"}],
  pushupk:[{id:"4Bc1tPaYkOo",short:true,title:"FIX THESE Pushup Mistakes!",by:"Andrew Kwong (DeltaBolic)"}]
};
function vids(k){ store.videos=store.videos||{}; if(!store.videos[k]) store.videos[k]=(DEFAULT_VIDEOS[k]||[]).map(v=>Object.assign({},v)); return store.videos[k]; }
function vidUrl(v){ return v.short?"https://www.youtube.com/shorts/"+v.id:"https://www.youtube.com/watch?v="+v.id; }
function parseYT(u){ const m=String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:shorts\/|watch\?(?:[^#]*&)?v=|embed\/|live\/))([A-Za-z0-9_-]{11})/); return m?{id:m[1],short:/\/shorts\//.test(u)}:null; }
// editable = the raw exercise key when shown in How-to (adds remove + paste-a-link form)
function vidCards(k, editable){
  const list=vids(k);
  const cards=list.map((v,i)=>`<div class="vid"><a class="vid-link" href="${vidUrl(v)}" target="_blank" rel="noopener"><span class="vid-play" aria-hidden="true"></span><span class="vid-txt"><b>${esc(v.title||"Saved video")}</b><span>${v.by?esc(v.by)+" · ":""}${v.short?"YouTube Short":"YouTube"} ↗</span></span></a>${editable?`<button class="vid-x" data-vdel="${k}|${i}" data-open="${editable}" aria-label="Remove this video">×</button>`:""}</div>`).join("");
  const form=editable?`<form class="vid-add" data-vadd="${k}" data-open="${editable}">
      <input class="vid-url" id="va-${k}" placeholder="Paste a YouTube link" inputmode="url" autocomplete="off" aria-label="YouTube link">
      <input id="vn-${k}" placeholder="Name (optional)" autocomplete="off" aria-label="Video name">
      <button type="submit">Add video</button>
      <div class="note vid-err" id="ve-${k}" hidden></div></form>`:"";
  return (cards||form)?`<div class="vids">${cards?`<div class="eyebrow">Saved videos</div>`+cards:""}${form}</div>`:"";
}
const demoFor = (key, during, extra, opts) => DEMO.html((P&&P.easy&&key==="wallsit"&&P.phase!=="done")?"wallsithigh":demoKey(key), coach(key, during), yt(EX[key].q), extra===undefined?vidCards(key):extra, opts);

/* ---------- small controls ---------- */
function pushToggle(who){
  const kid = who==="kid", knee = kid ? store.kidStyle!=="full" : store.pushStyle==="knee";
  return `<div class="seg" role="group" aria-label="Push-up style"><button data-push="full" data-who="${who}" aria-pressed="${!knee}">Full push-up</button><button data-push="knee" data-who="${who}" aria-pressed="${knee}">On knees</button></div>`;
}
function trainToggle(){
  const t=!!store.together;
  return `<div class="trainer"><div class="seg" role="group" aria-label="Who's training"><button data-together="0" aria-pressed="${!t}">Just me</button><button data-together="1" aria-pressed="${t}">With ${esc(partner())}</button></div>
    ${t?`<div class="pname"><label class="lbl" for="partner">Training partner's name</label><input id="partner" value="${esc(store.partner||"")}" placeholder="Son" autocomplete="off"></div>
      <div class="note">You take turns: you do a set, then ${esc(partner())} does his. His version uses bodyweight only. The treadmill walk is hidden while you train together.</div>`:""}</div>`;
}

/* ---------- views ---------- */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.view===view?"page":"false"));
  const app = document.getElementById("app");
  app.innerHTML = view==="week" ? weekView() : view==="workout" ? workoutView() : view==="learn" ? learnView() : movesView();
  window.scrollTo(0,0);
}
function rerender(){ const y=window.scrollY; render(); window.scrollTo(0,y); }

// Training together is strength only, so the solo walk drops off the plan
const forMode = sid => !(store.together && SESS[sid].solo);
const dayList = d => (WEEK[d.getDay()]||[]).filter(forMode);
function weekView(){
  const dates = weekDates(); const t = todayKey();
  let planned=0, done=0;
  dates.forEach(d=>{ dayList(d).forEach(sid=>{ planned++; if(isDone(dkey(d),sid)) done++; }); });
  const days = dates.map(d=>{
    const k=dkey(d); const list=dayList(d); const isT = k===t;
    const label = d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
    const rows = list.length ? list.map(sid=>{
      const s=SESS[sid]; const names=[...new Set(s.items.map(it=>EX[exKey(it.ex)].name))].join(" · ");
      const dn = isDone(k,sid);
      return `<div class="sess"><div class="meta"><div class="name">${s.name} <span class="muted num">~${estMin(sid)} min</span></div>${names}</div>
        ${dn?`<span class="check">✓ Done</span>`: `<button class="${isT?'primary':''}" data-start="${sid}">Start</button>`}</div>`;
    }).join("") : `<div class="meta muted">Rest day. An easy walk is plenty.</div>`;
    return `<section class="card day ${isT?'today':''}"><div class="dayhead"><h3>${DAYS[d.getDay()]}</h3><span class="muted">${isT?'<span class="tag">Today</span> ':''}${label}</span></div>${rows}</section>`;
  }).join("");
  return `<header class="top"><div><div class="eyebrow">This week</div><h1>Home Gym Week</h1></div>
    <div class="num weekcount">${done}<span class="muted"> of ${planned}</span></div></header>
    ${trainToggle()}
    ${P && P.phase!=="done" ? `<div class="hint">You have a workout in progress: ${SESS[P.sid].name}. <button data-view="workout" style="margin-top:8px">Resume</button></div>`:""}
    ${days}`;
}

function pickerView(){
  const order=["quick","warm","push","grip","legs","walk"];
  return `<header><div class="eyebrow">Short on time?</div><h1>Pick a session</h1></header>
    ${trainToggle()}
    ${order.filter(forMode).map(sid=>{ const s=SESS[sid]; return `<section class="card day"><div class="dayhead"><h3>${s.name}</h3><span class="num muted">~${estMin(sid)} min</span></div>
      <div class="muted">${s.about}</div>
      <div class="chips">${s.items.map(it=>`<span class="chip">${EX[exKey(it.ex)].name}${isFlow(it.ex)||it.ex==="treadmill"?"":" · "+it.sets+"×"}</span>`).join("")}</div>
      <button class="primary" data-start="${sid}">Start ${s.name}</button></section>`; }).join("")}`;
}

function upNext(){
  return `<div class="upnext">${SESS[P.sid].items.map((it,idx)=>{
    const e=EX[exKey(it.ex)], cls = idx<P.i ? "past" : idx===P.i ? "cur" : "";
    const amt = e.type==="flow" ? "2 min" : e.type==="cardio" ? e.minutes+" min" : setsOf(it)+" × "+e.range.join("–")+" "+unit(e);
    return `<div class="${cls}"><span>${e.name}</span><span class="num">${amt}</span></div>`;
  }).join("")}</div>`;
}

function workoutView(){
  if(!P) return pickerView();
  const s = SESS[P.sid], items = s.items;
  const totalSets = items.reduce((a,it)=>a+setsOf(it),0);
  const doneSets = P.phase==="done" ? totalSets : items.slice(0,P.i).reduce((a,it)=>a+setsOf(it),0)+P.s;
  const prog = `<div class="progress">${Array.from({length:totalSets},(_,i)=>`<i class="${i<doneSets?'on':''}"></i>`).join("")}</div>`;

  if(P.phase==="done"){
    const mins=Math.max(1,Math.round(((P.endedAt||Date.now())-P.startedAt)/60000));
    const moves=items.filter(it=>!isFlow(it.ex)).length;
    return `<header><div class="eyebrow">Finished</div><h1>${s.name} done</h1></header>${prog}
      <section class="card"><table class="sum">
        <tr><td>Time</td><td>${mins} min</td></tr>
        <tr><td>Moves</td><td>${moves}</td></tr>
        <tr><td>Sets${P.together?" (each)":""}</td><td>${P.setsDone}</td></tr></table>
        ${P.together?`<p class="note" style="margin:10px 0 0">You and ${esc(partner())} trained together.</p>`:""}</section>
      <button class="primary big" id="close">Back to the week</button>`;
  }

  if(P.phase==="check"){
    return `<header class="top"><div style="min-width:0"><div class="eyebrow">${s.name}</div><h1>How do your knees feel?</h1></div>
      <button id="end" style="flex:none">${endArm?"Tap again to end":"End"}</button></header>
      <section class="card player">
        <button class="primary big" id="kneeGood">Good to go</button>
        <button class="big" id="kneeSore">A little sore</button>
        <div class="note">A little sore gives you an easier day: one less set of wall sits, calf raises and deadlifts, and a shallow wall sit capped at 20 seconds.</div>
        <button id="kneeSkip">Too sore today: do Push + pull instead</button>
        <div class="note">Sharp pain, swelling, or pain that keeps getting worse is a reason to stop and get your knee checked.</div>
      </section>`;
  }
  const it = item(), key = curKey(), e = EX[key], kid = isKidTurn();
  const head = `<header class="top"><div style="min-width:0"><div class="eyebrow">${s.name}</div><h1>${P.phase==="rest"?"Rest":e.name}</h1></div>
    <button id="end" style="flex:none">${endArm?"Tap again to end":"End"}</button></header>${prog}${DEMO.gate()}`;
  const turn = P.together && !isFlow(it.ex) ? `<div class="turn ${kid?'kid':''}"><b>${kid?esc(partner())+"'s turn":"Your turn"}</b><span>${kid?"You're next":esc(partner())+" goes next"}</span></div>` : "";

  if(P.phase==="rest"){
    const left=(P.restEnd-Date.now())/1000;
    return `${head}<section class="card player">
      <div class="clock" id="clock">${fmt(left)}</div><div class="bar"><i id="fill"></i></div>
      <div><div class="eyebrow">Up next</div><div class="nextup">${e.name}${e.type==="flow"?"":" · set "+(P.s+1)+" of "+setsOf(it)}</div>
        ${P.together?`<div class="note">You go first, then ${esc(partner())}.</div>`:""}</div>
      ${it.ex==="pushup"?pushToggle("me"):""}
      ${demoFor(key,false)}
      <div class="row"><button id="plus15">+15 s</button><button class="primary" id="skip">Skip rest</button></div></section>
      <section class="card">${upNext()}</section>`;
  }

  if(e.type==="flow"){
    if(P.phase==="flow"){
      const F=parts(), part=F[P.fi], left=(P.flowEnd-Date.now())/1000;
      return `${head}<section class="card player">
        <div class="eyebrow">${P.sw?"Get into position":"Move "+(P.fi+1)+" of "+F.length}</div>
        <div class="nextup">${P.sw?"Next: ":""}${part.name}</div>
        <div class="clock ${P.sw?"switch":""}" id="clock">${fmt(left)}</div><div class="bar"><i id="fill"></i></div>
        ${DEMO.html(part.k, partCoach(part), yt(e.q), "")}
        <ol class="flowlist">${F.map((w,i)=>`<li class="${i<P.fi?'past':i===P.fi?'cur':''}">${w.name} <span class="muted num">${fmt(w.sec)}</span></li>`).join("")}</ol>
        <button id="skipFlow">${P.sw?"Start now":"Next move"}</button></section>`;
    }
    return `${head}<section class="card player">
      <div class="target"><div><span class="eyebrow">Time</span><b>${Math.round((parts().reduce((a,w)=>a+w.sec,0)+(parts().length-1)*SWITCH_SEC+3)/30)/2} min</b></div><div><span class="eyebrow">Effort</span><b>${it.ex==="cooldown"?"Gentle":"Easy"}</b></div></div>
      <ol class="flowlist">${parts().map(w=>`<li>${w.name} <span class="muted num">${fmt(w.sec)}</span></li>`).join("")}</ol>
      ${P.together?`<div class="note">Do this one together, side by side.</div>`:""}
      ${DEMO.html(parts()[0].k, coach(it.ex,false), yt(e.q), "", {list:parts().map(w=>({k:w.k,name:w.name}))})}
      <div class="note">${SWITCH_SEC} seconds between moves to get into position. The voice tells you what's next.</div>
      <button class="primary big" id="startFlow">Start ${e.name.toLowerCase()}</button>
      <button id="skipWarm">Skip ${e.name.toLowerCase()}</button></section>
      <section class="card">${upNext()}</section>`;
  }

  if(e.type==="cardio"){
    return `${head}<section class="card player">
      <div class="target"><div><span class="eyebrow">Target</span><b>${e.target}</b></div></div>
      ${demoFor(key,true,undefined,{slow:true})}

      <button class="primary big" id="walkDone">Walk done</button></section>`;
  }

  if(P.phase==="hold"){
    const el=(Date.now()-P.holdStart)/1000;
    return `${head}${turn}<section class="card player">
      <div class="eyebrow">Set ${P.s+1} of ${setsOf(it)}</div>
      <div class="clock" id="clock">${fmt(P.holdLen-el)}</div><div class="bar"><i id="fill"></i></div>
      ${demoFor(key,true)}
      <button class="big" id="stopHold">Stop early</button></section>`;
  }

  const hs = e.type==="time" ? easyCap(key,holdSec(key,kid)) : 0;
  const kidTarget = e.type==="time" ? "Hold with good form" : "5–10 good reps";
  const target = kid ? kidTarget : `${e.range.join("–")} ${unit(e)}${e.each&&e.type!=="time"?" each side":""}`;
  const chips = [`Set ${P.s+1} of ${setsOf(it)}`, target];
  if(!kid && e.weighted && e.start) chips.push(`~${e.start} lb${e.each&&e.type==="time"?" each hand":""}`);
  if(!P.together) chips.push(`Rest ${it.rest}s after`);
  const effort = kid ? "Stop while every rep still looks good." : e.type==="time" ? "Pick a hold you can just finish with good form." : "End the set with 1–3 good reps left.";
  const holdBlock = e.type==="time" ? `<div><label class="lbl" for="hs">Hold length (seconds)</label>
    <div class="stepper"><button data-hadj="-5" aria-label="Shorter">−</button><input id="hs" inputmode="numeric" value="${hs}"><button data-hadj="5" aria-label="Longer">+</button></div></div>` : "";

  return `${head}${turn}<section class="card player">
    ${it.ex==="pushup"?pushToggle(kid?"kid":"me"):""}
    ${demoFor(key,false)}
    <div class="chips">${chips.map(c=>`<span class="chip">${c}</span>`).join("")}</div>
    <div class="note">${(P.easy&&!kid&&KNEE_EASY.includes(it.ex))?"Easy day for your knees: go partway down and stop at any pain.":effort}${!kid&&e.scale?" "+e.scale:""}</div>
    ${holdBlock}
    ${TEMPO[key] ? `${T?tempoPanel():""}<button id="tempoBtn">${T?"Stop tempo beeps":"Start tempo beeps"}</button>` : ""}
    ${e.type==="time" ? `<button class="primary big" id="startHold">Start ${hs}-second hold</button>` : `<button class="primary big" id="setDone">Set done</button>`}
  </section>
  <section class="card">${upNext()}</section>`;
}

function learnView(){

/* ---------- events ---------- */
document.addEventListener("click", ev=>{
  const b = ev.target.closest("button"); if(!b) return;
  unlockAudio();
  if(b.dataset.view){ view=b.dataset.view; endArm=false; render(); return; }
  if(b.dataset.start){ start(b.dataset.start); return; }
  if(b.dataset.together){ store.together = b.dataset.together==="1"; save(); rerender(); return; }
  if(b.dataset.push){
    if(b.dataset.who==="kid") store.kidStyle=b.dataset.push; else store.pushStyle=b.dataset.push;
    save(); if(view==="moves") openMove="pushup"; rerender(); return;
  }
  if(b.dataset.hadj){
    const k=curKey(), kid=isKidTurn(), id=(kid?"kid:":"")+k; holdSec(k,kid);
    store.hold[id]=Math.min(180,Math.max(5,store.hold[id]+Number(b.dataset.hadj))); save();
    const inp=document.getElementById("hs"); if(inp) inp.value=store.hold[id];
    const sh=document.getElementById("startHold"); if(sh) sh.textContent=`Start ${store.hold[id]}-second hold`;
    return;
  }
  if(b.dataset.vdel){ const [k,i]=b.dataset.vdel.split("|"); vids(k).splice(Number(i),1); save(); openMove=b.dataset.open; rerender(); return; }
  switch(b.id){
    case "setDone": setDone(); break;
    case "tempoBtn": if(T) stopTempo(); else startTempo(); rerender(); break;
    case "kneeGood": P.easy=false; P.phase="work"; persist(); render(); announceTurn(); break;
    case "kneeSore": P.easy=true; P.phase="work"; persist(); render(); announce("Easy day for your knees. Partway down only."); break;
    case "kneeSkip": start("push"); break;
    case "walkDone": setDone(); break;
    case "startHold": { keepAwake(); const k=curKey(); P.phase="hold"; P.holdStart=Date.now(); P.holdLen=easyCap(k,holdSec(k,isKidTurn())); persist(); render(); break; }
    case "stopHold": setDone(); break;
    case "startFlow": startFlow(); break;
    case "skipFlow": nextFlow(); break;
    case "skipWarm": advance(0); break;
    case "skip": P.phase="work"; persist(); render(); announceTurn(); break;
    case "plus15": P.restEnd+=15000; P.restLen+=15; persist(); break;
    case "end":
      if(!endArm){ endArm=true; b.textContent="Tap again to end"; setTimeout(()=>{ endArm=false; const x=document.getElementById("end"); if(x) x.textContent="End"; },3000); }
      else { endArm=false; closeWorkout(); }
      break;
    case "close": closeWorkout(); break;
  }
});
document.addEventListener("submit", ev=>{
  const f=ev.target.closest("form.vid-add"); if(!f) return; ev.preventDefault();
  const k=f.dataset.vadd, url=document.getElementById("va-"+k).value.trim(), name=document.getElementById("vn-"+k).value.trim();
  const v=parseYT(url), err=document.getElementById("ve-"+k);
  if(!v){ err.textContent="That doesn't look like a YouTube link. Copy it from the Share button in YouTube and paste it here."; err.hidden=false; return; }
  vids(k).push({id:v.id,short:v.short,title:name||"Your saved video",by:""}); save(); openMove=f.dataset.open; rerender();
});
document.addEventListener("input", ev=>{
  if(ev.target.id==="partner"){ store.partner=ev.target.value.slice(0,24); save();
    document.querySelectorAll('[data-together="1"]').forEach(x=>x.textContent="With "+partner()); return; }
  if(ev.target.id==="hs" && P){ const k=curKey(), kid=isKidTurn(), id=(kid?"kid:":"")+k; holdSec(k,kid);
    store.hold[id]=Math.min(180,Math.max(5,Number(ev.target.value.replace(/\D/g,""))||5)); save();
    const sh=document.getElementById("startHold"); if(sh) sh.textContent=`Start ${store.hold[id]}-second hold`; }
});
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && P && P.phase!=="done") keepAwake(); });

render();

</script>
